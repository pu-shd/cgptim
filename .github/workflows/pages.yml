name: Validate and deploy Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Provide docker-compose command
        run: echo "$GITHUB_WORKSPACE/.github/bin" >> "$GITHUB_PATH"
      - name: Run format, lint, type, unit, build, and browser checks in Docker
        run: docker-compose run --build --rm tests
      - name: Build the deployment artifact from the validated source
        run: |
          set -euo pipefail
          docker build --target build -t cgptim-build .
          container=$(docker create cgptim-build)
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/app/dist" ./dist
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: browser-test-results
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v5.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
